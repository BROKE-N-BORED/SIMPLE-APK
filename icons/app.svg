<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Simple APK icon: the warm workbench. A charcoal bench tile, an
       amber work-lamp arc across the top, a white phone with an amber
       check badge: source in, finished app out. -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#2b2622"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#4a443e" stroke-width="6"/>
  <!-- work-lamp arc -->
  <path d="M 96 176 A 200 200 0 0 1 416 176" fill="none" stroke="#e8a33d" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="96" r="26" fill="#e8a33d"/>
  <!-- phone -->
  <rect x="176" y="190" width="160" height="252" rx="28" fill="none" stroke="#f7f5f0" stroke-width="18"/>
  <line x1="232" y1="224" x2="280" y2="224" stroke="#f7f5f0" stroke-width="14" stroke-linecap="round"/>
  <!-- check inside the phone -->
  <polyline points="216,318 246,348 300,286" fill="none" stroke="#e8a33d" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- home dot -->
  <circle cx="256" cy="412" r="12" fill="#c9c0ad"/>
</svg>
